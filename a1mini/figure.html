  .stats .stat{text-align:left}

}

</head><body>
<script src="core.js"></script>
<script>
(function(){
'use strict';
/* ============================================================
   拓竹 Bambu Lab A1 mini — 使用教程（Colorfigures）
   比例 1 单位 = 5 mm。x = 深度（正面 x=63），y = 宽度（0 是 Z 立柱一侧），z 向上。
   机身 347×315×365 mm → 63 × 69 × 73 单位；成型 180³ mm → 36³ 单位。

   真实结构与运动（资料见 notes.md）：
   · Y 轴：热床托架沿水平导轨前后走（本图 x 方向），同步带由尾部 Y 电机驱动。
   · X 轴：工具头沿悬臂横梁的线轨左右走（本图 y 方向），X 电机在右端电机罩内。
   · Z 轴：整个龙门沿单立柱升降；Z 电机 → 联轴器 → 丝杠 → 螺母。
   · 热床 3 点螺丝调平；喷嘴擦嘴胶条在热床左缘；吐料槽在左侧（图中固定在热床旁，简化）。
   · 工具头：五通 → 挤出双齿轮 → 热端（散热片/热阻断器/加热块/0.4 喷嘴）；5015 双风道冷却；切刀；
     进料霍尔板；摄像头在 X 电机罩内（朝打印区）。
   · 调平：喷嘴逐点触碰热床 6×6=36 点，生成高度映射。
   · 进料：PTFE 管 → 五通 → 挤出轮 → 250 ℃ 喷嘴，正常吐料即完成。

   部件清单（透视用）：
   外壳：底座下壳/上盖/后电器罩/屏幕座/Z 立柱/顶盖/横梁/X 电机罩/工具头壳/前盖/喷头罩/料盘支架
   Z：Z 电机/联轴器/丝杠/Z 螺母/Z 线轨/抱箍
   X：X 线轨/同步带/X 电机/带轮/张紧器/滑车
   Y：Y 导轨/同步带/Y 电机/带轮/热床托架/3×调平弹簧
   热床：加热板/加热线圈/磁铁/PEI 板/把手/擦嘴条/吐料槽
   工具头：挤出电机/挤出双齿轮/进料霍尔板/切刀/五通/散热片/热阻断器/加热块/喷嘴/硅胶套/
          热端风扇/5015 部件风扇/双风道
   电子：主控板/电源/Wi-Fi 天线/摄像头/USB 小板/屏幕
   耗材：料盘/PTFE 管/排线
   ============================================================ */

const MW = 63, MD = 69, MH = 73;            // 机身包围盒
const BASE_TOP = 9, BED_TOP = 12.4, PLATE_TOP = 13.5;
const PART_H = 16, LAYERS = 32;
const NOZ = 20.4;                            // 喷嘴尖端到横梁中心的高度
const G_IDLE = 47, G_TOUCH = PLATE_TOP + NOZ;

const CASEM  = { l:'#f3f1e9', m:'#dcd8cd', d:'#b2ada0' };
const GREYM  = { l:'#d2d5d2', m:'#aeb3b0', d:'#7d827f' };
const DARKM  = { l:'#4d5255', m:'#373c3f', d:'#24282b' };
const BEDM   = { l:'#a8adad', m:'#838888', d:'#5c6161' };
const PLATEM = { l:'#3d4245', m:'#2e3234', d:'#1f2325' };
const RUBB   = { l:'#3d3d3a', m:'#2c2c2a', d:'#1b1b1a' };
const PCBM   = { l:'#2f6b4f', m:'#255740', d:'#173a2b' };
const GOLDM  = { l:'#e8c45f', m:'#c8a23f', d:'#8e6f24' };
const GREEN  = '#12a24a';
const HOT    = '#ff6a2a';
const PLAM   = { l:'#3fae66', m:'#2f8c50', d:'#1d5c33' };
const CREAMM = { l:'#f8f4e5', m:'#e6e0cc', d:'#bfb7a0' };

const CHUTE_Y0 = 59.8, CHUTE_Y1 = 65, CHUTE_X0 = 24, CHUTE_X1 = 36;
const GRID_X = [28, 30.8, 33.6, 36.4, 39.2, 42];
const GRID_Y = [24, 29.6, 35.2, 40.8, 46.4, 52];
const SPOOL = { x:33, y:-27, z:58, r:21, w:12 };   // 外挂料盘：轴向前后，悬在 Z 立柱后方、机身之外

let ui;
const baseP = [], mechP = [], mechTop = [];
let clipN = 0;

/* ---------- helpers ---------- */
const lerp = (a,b,t) => a + (b-a)*t;
const v3 = (x0,y0,z0,x1,y1,z1) => [[Math.min(x0,x1),Math.min(y0,y1),Math.min(z0,z1)],[Math.max(x0,x1),Math.max(y0,y1),Math.max(z0,z1)]];

function slab(x0,y0,x1,y1,z0,z1,r,m,shade=tone,w=1){
  const A = on(PZ(z0), rrUV(x0,y0,x1,y1,r)), B = on(PZ(z1), rrUV(x0,y0,x1,y1,r));
  let s = loft(A,B,n => shade(n,m));
  if (facing([0,0,1])) s += fill(pd(B), shade([0,0,1],m)) + ink(pd(B), w*.8);
  if (facing([0,0,-1])) s += fill(pd(A), shade([0,0,-1],m)) + ink(pd(A), w*.8);
  return s + hullInk([...A,...B], w);
}
function putShell(b, svg){ baseP.push({ box:b, svg, shell:true }); }
function putHard(b, svg){ baseP.push({ box:b, svg, shell:false }); }
function putMech(b, svg){ mechP.push({ box:b, svg }); }
function putTop(b, svg){ mechTop.push({ box:b, svg }); }
function bxT(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.8){ putTop(v3(x0,y0,z0,x1,y1,z1), box(x0,y0,z0,x1,y1,z1,m,shade,w)); }

function bxS(x0,y0,z0,x1,y1,z1,m,shade=tone,w=1){ putShell(v3(x0,y0,z0,x1,y1,z1), box(x0,y0,z0,x1,y1,z1,m,shade,w)); }
function bxH(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){ putHard(v3(x0,y0,z0,x1,y1,z1), box(x0,y0,z0,x1,y1,z1,m,shade,w)); }
function bxM(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.8){ putMech(v3(x0,y0,z0,x1,y1,z1), box(x0,y0,z0,x1,y1,z1,m,shade,w)); }
function slS(x0,y0,x1,y1,z0,z1,r,m,shade=tone,w=1){ putShell(v3(x0,y0,z0,x1,y1,z1), slab(x0,y0,x1,y1,z0,z1,r,m,shade,w)); }
function slH(x0,y0,x1,y1,z0,z1,r,m,shade=toneI,w=1){ putHard(v3(x0,y0,z0,x1,y1,z1), slab(x0,y0,x1,y1,z0,z1,r,m,shade,w)); }
function slM(x0,y0,x1,y1,z0,z1,r,m,shade=toneI,w=.8){ putMech(v3(x0,y0,z0,x1,y1,z1), slab(x0,y0,x1,y1,z0,z1,r,m,shade,w)); }

function cylY(y0,y1,x,z,r,m,shade=toneI,w=1,n=20){
  const A = on(PY(y0), ellUV(x,z,r,r,n)), B = on(PY(y1), ellUV(x,z,r,r,n));
  const plus = facing([0,1,0]), cap = plus ? B : A, cn = plus ? [0,1,0] : [0,-1,0];
  return loft(A,B,nr => shade(nr,m)) + (vis(cn) ? fill(pd(cap), shade(cn,m)) + ink(pd(cap), w*.8) : '') + hullInk([...A,...B], w);
}
function discY(y,x,z,r,col){ return fill(pd(on(PY(y), ellUV(x,z,r,r,18))), col); }
function clipPrism(pts3, inner){
  const id = 'pp' + (++clipN);
  const h = hull(pts3.map(p => P(p[0],p[1],p[2])));
  return `<clipPath id="${id}"><path d="${sp(h)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`;
}
function wire(pts, col, w, outer){
  const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(w+1.2)}" stroke-linecap="round" stroke-linejoin="round"/>`
       + `<path d="${d}" fill="none" stroke="${col||'#2c2f2e'}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function curve(pts, n){
  const P2 = [];
  for (let i=0; i<pts.length-1; i++){
    const a = pts[Math.max(0,i-1)], b = pts[i], c = pts[i+1], d = pts[Math.min(pts.length-1,i+2)];
    for (let j=0; j<n; j++){
      const t = j/n, t2=t*t, t3=t2*t;
      P2.push([0,1,2].map(k => .5*((2*b[k]) + (-a[k]+c[k])*t + (2*a[k]-5*b[k]+4*c[k]-d[k])*t2 + (-a[k]+3*b[k]-3*c[k]+d[k])*t3)));
    }
  }
  P2.push(pts[pts.length-1]);
  return P2;
}
function partOf(points, f0, f1){
  const out = [], n = points.length-1, i0 = Math.floor(n*f0), i1 = Math.ceil(n*f1);
  for (let i=i0; i<=i1; i++) out.push(points[Math.max(0,Math.min(n,i))]);
  return out;
}
function boxOf(pts){ return [ [Math.min(...pts.map(p=>p[0])), Math.min(...pts.map(p=>p[1])), Math.min(...pts.map(p=>p[2]))],
                              [Math.max(...pts.map(p=>p[0])), Math.max(...pts.map(p=>p[1])), Math.max(...pts.map(p=>p[2]))] ]; }

/* ---------- labels (Chinese pills; width accounts for CJK glyphs) ---------- */
const CNFONT = "ui-monospace,Menlo,Consolas,'Microsoft YaHei','PingFang SC',sans-serif";
function cnTag(p3, dx, dy, text, on){
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(p3[0],p3[1],p3[2]), fs = u ? 10*u : 8.4*k, h = u ? 17*u : fs*1.9;
  const w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*1.02 + fs*1.3, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.35)}" font-size="${f(fs)}" text-anchor="middle" font-family="${CNFONT}" font-weight="800" letter-spacing=".02em" fill="${INK}">${u ? n : text}</text></g>`;
}
function cnCallouts(items, B){
  const pts = []; for (const x of [B[0],B[1]]) for (const y of [B[2],B[3]]) for (const z of [B[4],B[5]]) pts.push(P(x,y,z));
  const xmin = Math.min(...pts.map(p=>p[0])), xmax = Math.max(...pts.map(p=>p[0])), cx = (xmin+xmax)/2;
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.4*k, hgt = u ? 17*u : fs*1.9, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*1.02 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X,Y] = P(it.at[0],it.at[1],it.at[2]); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  const top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  // keep the right column clear of the temperature panel and the See-through / Labels switches
  const chrome = window.innerWidth > 560 ? (document.querySelector('.vset') || document.getElementById('stats')) : null;
  if (chrome && svgEl.getScreenCTM()){ const r = chrome.getBoundingClientRect();
    const q = new DOMPoint(r.right, r.bottom + 6).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[1] = Math.max(top[1], q.y + hgt); }
  for (const [col, side] of [[L,-1],[R,1]]){
    col.sort((a,b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a,c) => a + c.py - c.Y, 0)/col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1));
      const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*1.02 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2;
      px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex - side*4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px-w/2)}" y="${f(c.py-hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py+fs*.35)}" font-size="${f(fs)}" text-anchor="middle" font-family="${CNFONT}" font-weight="800" letter-spacing=".02em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}

/* ---------- desk ---------- */
function desk(){
  const A = on(PZ(-4), rrUV(-7,-24,78,78,5)), B = on(PZ(0), rrUV(-7,-24,78,78,5));
  return loft(A,B,n => toneI(n, WOOD)) + fill(pd(B), WOOD.l) + ink(pd(B), 1.2) + hullInk([...A,...B], 2);
}

/* ---------- printed part: a small tugboat, layer by layer ---------- */
function boat(st, bd, ox, oy, oz){
  const x0 = 28, x1 = 42, y0 = 31, y1 = 45, z0 = PLATE_TOP;
  const cy = (y0+y1)/2 + oy;
  const top = z0 + PART_H*Math.min(1, st.prog) + oz;
  const T = (x,y,z) => [x + bd + ox, y + oy, z + oz];
  let s = '';
  // hull: wide stern at the back, tapered bow at the front (x1)
  const A = on(PX(x0), rrUV(y0, z0, y1, z0+8, 2.4));
  const B = on(PX(x1), rrUV(y0+4, z0, y1-4, z0+6, 1.8));
  const AW = A.map(p => T(...p)), BW = B.map(p => T(...p));
  s += loft(AW, BW, n => toneI(n, PLAM));
  if (facing([1,0,0])) s += fill(pd(BW), toneI([1,0,0], PLAM)) + ink(pd(BW), .8);
  if (facing([-1,0,0])) s += fill(pd(AW), toneI([-1,0,0], PLAM)) + ink(pd(AW), .8);
  s += hullInk([...AW,...BW], 1.4);
  // cabin, roof, funnel
  s += box(x0+3+bd+ox, y0+2+oy, z0+6.5+oz, x1-5+bd+ox, y1-2+oy, z0+12.5+oz, CREAMM, toneI, .8);
  s += box(x0+2+bd+ox, y0+1+oy, z0+12.5+oz, x1-4+bd+ox, y1-1+oy, z0+13.3+oz, CREAMM, toneI, .8);
  s += cyl(34+bd+ox, cy, z0+13.3+oz, z0+16+oz, 1.15, PLAM, toneI, .8, 14);
  // windows
  if (facing([1,0,0])) s += shape(on(PX(x1-5+bd+ox+.06), rectUV(y0+3+oy, z0+9.2+oz, y1-3+oy, z0+11.2+oz)), '#243632', .5);
  if (facing([0,1,0])) s += shape(on(PY(y1-2+oy+.06), rectUV(x0+4+bd+ox, z0+9.2+oz, x1-6+bd+ox, z0+11.2+oz)), '#243632', .5);
  // print layer lines on the cabin
  let ln = '';
  for (let z = z0+8.2; z < top-.2; z += .55){
    if (z < z0+12.4){
      if (facing([1,0,0])) ln += pd([[x1-5+bd+ox+.08, y0+2+oy, z],[x1-5+bd+ox+.08, y1-2+oy, z]], false);
      if (facing([0,1,0])) ln += pd([[x0+3+bd+ox, y1-2+oy+.08, z],[x1-5+bd+ox, y1-2+oy+.08, z]], false);
    }
  }
  if (ln) s += `<path d="${ln}" fill="none" stroke="${PLAM.d}" stroke-width=".45" opacity=".55"/>`;
  // the layer being laid right now
  if (st.phase === 'printing' && st.prog > 0 && st.prog < .999){
    const zt = z0 + PART_H*st.prog + oz;
    s += ink(pd(on(PZ(zt+.05), rrUV(x0+2+bd+ox, y0+2+oy, x1-2+bd+ox, y1-2+oy, 2))), 1.1);
    s += fill(pd(on(PZ(zt+.06), rrUV(x0+3+bd+ox, y0+3+oy, x1-3+bd+ox, y1-3+oy, 2))), '#ffb24a', 'opacity=".35"');
  }
  return clipPrism([...on(PZ(z0), rectUV(x0+bd+ox, y0+oy, x1+bd+ox, y1+oy)),
                    ...on(PZ(top), rectUV(x0+bd+ox, y0+oy, x1+bd+ox, y1+oy))], s);
}

/* ---------- scene ---------- */
function scene(st, m){
  window.__ln = {};
  baseP.length = 0; mechP.length = 0; mechTop.length = 0; clipN = 0;
  const k = ease(st.xr || 0);
  const g = st.g, ty = st.ty, bd = st.bedX;
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]), LEFT = facing([0,1,0]), RIGHT = facing([0,-1,0]);
  const UP = facing([0,0,1]);

  let s = desk();
  s += castShadow([[0,0,0],[63,0,0],[0,69,0],[63,69,0],[8,5,40],[20,17,40]], 0, boardTop(-7,-24,78,78,0,5));

  /* ---------- base ---------- */
  slS(2,2,61,67,1.2,5.6,4,CASEM);
  slS(3,4,60,65,5.6,9,4,CASEM);
  slS(2,3,10,66,9,12.5,3,CASEM);                      // rear electrical cover
  slS(55,46,61,62,9,19,3,CASEM);                      // screen tower, front-left
  // feet
  for (const [fx,fy] of [[5,5],[5,63],[57,5],[57,63]]) bxH(fx,fy,0,fx+4,fy+4,1.4,RUBB,toneI,.6);
  // screen: bezel + display, drawn only on the front face
  if (FRONT){
    let sc = shape(on(PX(61.06), rrUV(48,10.2,60,18.2,1.6)), DARKM.d, .9);
    sc += fill(pd(on(PX(61.12), rrUV(49,10.8,59,17.6,1.1))), '#15211d');
    sc += `<path d="${pd([[61.16,50,16.9],[61.16,58,16.9]], false)}" stroke="${GREEN}" stroke-width=".35" opacity=".7" fill="none"/>`;
    sc += tx(61.18, 54, 15.6, 'A1 mini', 1.35, '#cfe9dc', 800);
    sc += tx(61.18, 50.6, 13.9, '220°', 1.15, GREEN, 800) + tx(61.18, 56.2, 13.9, '60°', 1.15, GREEN, 800);

  // back vents + power inlet
  if (BACK){

  /* ---------- column + gantry ---------- */
  slS(7.5,4.5,20.5,17.5,9,73,2.5,CASEM);

  if (FRONT) putShell([[20.55,6,14],[20.7,16,72]], ink(pd([[20.6,7,71],[20.6,7,14]], false), .5));

  // gantry bracket (moves with Z)
  slS(8,6,22,19,g-6,g+6,2,GREYM);
  // cantilever beam along y
  {
    const prof = rrUV(9, g-5, 17, g+1, 1.6);
    const A = on(PY(14), prof), B = on(PY(64), prof);
    let beam = loft(A,B,n => tone(n,GREYM)) + hullInk([...A,...B], 2.2);

    putShell(v3(9,14,g-5,17,64,g+1), beam);
    if (FRONT) putShell([[17.0,16,g-3.6],[17.2,61,g-1.4]], fill(pd([[17.1,16,g-3.5],[17.1,61,g-3.5],[17.1,61,g-1.5],[17.1,16,g-1.5]]), '#24282a') + ink(pd([[17.12,16,g-3.5],[17.12,61,g-3.5]], false), .5));
  }
  // X motor cover (right end, camera inside)
  slS(18,2,31,16,g-6,g+6,2.5,CASEM);
  if (FRONT){
    let cv = '';
    cv += fill(pd(on(PX(31.06), ellUV(6.5, g-3.2, 1.7, 1.7, 14))), '#1d2224');
    cv += fill(pd(on(PX(31.10), ellUV(6.5, g-3.2, .8, .8, 12))), '#3c4d5b');
    cv += `<circle cx="${f(P(31.14,8.4,g-1.4)[0])}" cy="${f(P(31.14,8.4,g-1.4)[1])}" r="${f(.7*INK_K)}" fill="${GREEN}"/>`;

  if (FRONT) putShell([[30.9,3,g+1.2],[31.3,15,g+5.2]], tx(31.06, 9, g+3.2, 'Bambu Lab  A1 mini', 1.3, GREYM.d, 800));

  /* ---------- toolhead ---------- */
  const TH = { x0:23, x1:35, y0:ty-6, y1:ty+6, z0:g-18, z1:g+1 };
  slS(TH.x0,TH.y0,TH.x1,TH.y1,TH.z0,TH.z1,2.5,CASEM);
  if (FRONT){
    putShell([[35,ty-4.6,g-17.2],[35.6,ty+4.6,g-1]], shape(on(PX(35.06), rrUV(ty-4.4,g-17,ty+4.4,g-1.2,1.8)), CASEM.l, .9));
    let win = fill(pd(on(PX(35.16), ellUV(ty, g-4.0, 3.35, 3.35, 22))), '#252a2c');
    win += ink(pd(on(PX(35.17), ellUV(ty, g-4.0, 3.35, 3.35, 22))), .9);
    win += ink(pd(on(PX(35.18), ellUV(ty, g-4.0, 2.6, 2.6, 18))), .5);
    win += fill(pd(on(PX(35.19), ellUV(ty, g-4.0, 1.0, 1.0, 12))), GOLDM.l);
    win += tx(35.22, ty, g-8.6, 'Bambu Lab', .82, GREYM.d, 800);
    win += fill(pd(on(PX(35.20), ellUV(ty, g-4.2, 1.45, 1.45, 14))), GOLDM.l);
    win += ink(pd(on(PX(35.22), ellUV(ty, g-4.2, 1.45, 1.45, 14))), .5);
    win += `<path d="${pd([[35.24,ty-1.1,g-4.2],[35.24,ty+1.1,g-4.2]], false)}" stroke="${GOLDM.d}" stroke-width=".5"/>`;
    putShell([[35,ty-2,g-6],[35.4,ty+2,g-2]], win);
    putShell([[35.05,ty-3,g-16.2],[35.4,ty+3,g-14.6]], tx(35.3, ty, g-15.4, 'Bambu Lab', 1.0, GREYM.d, 800));
    const filLed = (st.loaded || st.fil > 0) ? GREEN : '#4a4f4c';
    putHard([[35.2,ty+3.4,g-2.1],[35.5,ty+4.2,g-1.3]], `<circle cx="${f(P(35.36,ty+3.8,g-1.7)[0])}" cy="${f(P(35.36,ty+3.8,g-1.7)[1])}" r="${f(.62*INK_K)}" fill="${filLed}" stroke="${INK}" stroke-width=".5"/>`);
  }
  // top hump + five-way hub
  slS(25,ty-3,31,ty+3,g+1,g+5,2,DARKM);
  bxS(26,ty-2,g+5,30,ty+2,g+7,DARKM,tone,1);
  putShell(v3(26.5,ty-1.4,g+7,29.5,ty+1.4,g+8.2), cyl(28,ty,g+7,g+8.2,1.5,GREYM,tone,1,14));
  // cutter lever on the right side

  // fan shroud + silicone sock (shell: fades in see-through)
  bxS(26,ty-5,g-19.4,34,ty+5,g-16.6,DARKM,tone,.9);
  for (const dy of [-3.4,3.4]) bxS(30,ty+dy-1.2,g-20.0,34,ty+dy+1.2,g-17.4,DARKM,tone,.8);
  bxS(31,ty-2.4,g-18.8,35,ty+2.4,g-16.2,RUBB,toneI,.8);
  // PTFE coupler on the hub
  putShell(v3(27.4,ty-1, g+8.2, 28.6, ty+1, g+9.4), cyl(28,ty,g+8.2,g+9.4,1.2,matOf('#4f7d93'),tone,1,12));

  /* ---------- bed (Y carriage, heatbed, plate) ---------- */
  slH(14+bd,24,55+bd,56,9.2,11.4,2,BEDM,toneI,1);
  slH(18+bd,22,54+bd,58,11.4,BED_TOP,2,BEDM,toneI,1);
  // bare heatbed detail when there is no plate
  if (!st.plate && st.phase !== 'fitting'){
    if (UP){
      let bd2 = '';
      for (const [mx,my] of [[22,26],[50,26],[22,54],[50,54]]) bd2 += fill(pd(on(PZ(BED_TOP+.03), ellUV(mx+bd,my,1.7,1.7,12))), '#23282b');
      bd2 += ink(pd(on(PZ(BED_TOP+.04), rrUV(20+bd,24,52+bd,56,2))), .6);

  // spring steel PEI plate (with the slide-in animation)
  if (st.plate || st.phase === 'fitting'){
    const po = st.plateSlide || 0;
    const plateSvg = slab(17.4+bd+po,21.4,54.6+bd+po,58.6,PLATE_TOP-.9,PLATE_TOP,2,PLATEM,toneI,1)
      + box(54.6+bd+po,34,PLATE_TOP-1,58.4+bd+po,46,PLATE_TOP-.15,DARKM,toneI,.8);

      + fill(pd(on(PZ(PLATE_TOP+.05), rectUV(40+bd,50.5,50.5+bd,53.5))), GOLDM.l));

      `<circle cx="${f(P(56.5+bd,21.5,PLATE_TOP)[0])}" cy="${f(P(56.5+bd,21.5,PLATE_TOP)[1])}" r="${f(.9*INK_K)}" fill="${GREEN}" stroke="${INK}" stroke-width=".6"/>`);
  }

    for (let yy of GRID_Y) grid += pd([[GRID_X[0]+bd, yy, PLATE_TOP+.16],[GRID_X[5]+bd, yy, PLATE_TOP+.16]], false);
    for (let xx of GRID_X) grid += pd([[xx+bd, GRID_Y[0], PLATE_TOP+.16],[xx+bd, GRID_Y[5], PLATE_TOP+.16]], false);

  if (UP) putHard([[CHUTE_X0,CHUTE_Y0,12.7],[CHUTE_X1,CHUTE_Y1,12.95]],

  {

    sp += box(19.4, 3.2, sz-1.6, 21.6, 5.8, sz+1.6, GREYM, toneI, .8);
    const aA=[21,4.9,sz-1.5], aB=[sx,front+2.4,sz-1.5], aC=[sx,front+2.4,sz+1.5], aD=[21,4.9,sz+1.5];
    const armQ = pd([aA,aB,aC,aD]);

  }
  // PTFE tube: coupler on the spool side -> toolhead (moves with the toolhead)
  const tubePts = curve([[33,-30,81],[32,-18,79.6],[31,-4,73],[33,16,64],[30,ty,54],[28,ty,g+9.2]], 7);

  const cabPts = curve([[24,ty-6,g+2],[22,ty-12,g+12],[18,ty-15,g+20],[21.9,22,60],[21.8,12,40],[21.6,9,17],[17,8,11]], 7);

  putHard(v3(-12,60,0,2,66,6), wire([[1,63,5],[0,66,2.5],[-3,70,1],[-7,74,1],[-11,77,1]], '#2b2b29', 1.5, 2.6));

  /* ---------- internals: Z (above the bed, inside the column) ---------- */
  bxT(11,8,4,17,14,11,DARKM);
  putTop(v3(13.4,10.4,11,14.6,11.6,13.6), cyl(14,11,11,13.6,1.5,METAL,toneI,.8,16));
  putTop(v3(13,10,13.5,15,12,71), rod([14,11,13.5],[14,11,71],.85,METAL,toneI,.8));
  { let sp=''; for (let i=0;i<=80;i++){ const a=i/80*Math.PI*2*14; sp += pd([[14+1.15*Math.cos(a),11+1.15*Math.sin(a),14.5+i/80*55]], false); }
    putTop(v3(12.6,9.6,14,15.4,12.4,70), `<path d="${sp}" fill="none" stroke="${METAL.d}" stroke-width=".35" opacity=".8"/>`); }

  bxT(17.1,16,g-3.5,18.5,62,g-2.2,METAL);

  putTop(v3(17.5,12,g-4.4,18.3,62,g-1.2), wire([[17.9,13,g-1.4],[17.9,62,g-1.4]],'#202425',.5) + wire([[17.9,13,g-3.9],[17.9,62,g-3.9]],'#202425',.5));

  putTop(v3(30.9,7.8,g-1.9,31.2,8.5,g-1.2), `<circle cx="${f(P(31.05,8.15,g-1.55)[0])}" cy="${f(P(31.05,8.15,g-1.55)[1])}" r="${f(.6*INK_K)}" fill="${GREEN}"/>`);

  // five-way hub + feed sensor + cutter
  bxT(26,ty-2,g+4.5,30,ty+2,g+7.4,DARKM);

/* ---------- behaviour ---------- */
const PHASES = ['fitting','loading','leveling','printing','removing'];
function busy(){ return PHASES.indexOf(ui.st.phase) >= 0; }
function now(){ return performance.now(); }
function say(st, key, text, ms){ if (st.said[key]) return; st.said[key] = 1; ui.flash(text, ms || 2600); }
function resetSaid(st){ st.said = {}; }

function stepSim(st, t, dt){
  const el = t - st.t0;

  if (st.phase === 'fitting'){
    const d = Math.min(1, el/650);
    st.plateSlide = 11*(1-ease(d));
    if (d >= 1){ st.plateSlide = 0; st.plate = true; st.phase = 'idle'; say(st,'plate','打印板磁吸到位 · 打印板检测通过'); }
  }

  else if (st.phase === 'loading'){
    st.nozzleT = Math.min(250, 25 + 225*Math.min(1, el/1800));
    if (el < 900){
      const e = ease(Math.min(1, el/900));
      st.ty = lerp(st.ty0, 60, e); st.g = lerp(st.g0, 36, e);
    } else {
      st.ty = 60; st.g = 36;
      st.fil = Math.min(1, (el-900)/2800);
      st.spin = (st.spin || 0) + dt*2.4;
    }
    if (el > 500) say(st,'ld0','工具头亮绿灯 → 屏幕点「进料」并选择耗材');
    if (el > 1800) say(st,'ld1','喷嘴 250℃（高温勿触碰）· 再次推入耗材，等正常吐料');
    if (el > 4000) st.purge = Math.min(1, (el-4000)/450);
    if (el > 4500){ st.loaded = true; say(st,'ld2','吐料正常 → 屏幕点「完成」'); }
    if (el > 5300){
      const e = ease(Math.min(1, (el-5300)/700));
      st.ty = lerp(60, 34, e); st.g = lerp(36, G_IDLE, e);
      st.nozzleT = lerp(250, 25, e);
      st.purge = Math.max(0, 1-e);
      if (el > 6000){ st.phase = 'idle'; st.fil = 1; st.spin = 0; st.nozzleT = 25; st.g = G_IDLE; st.ty = 34; say(st,'load','进料完成 · 喷嘴正常吐料'); }
    }
  }

  else if (st.phase === 'leveling'){
    st.bedT = 25; st.nozzleT = Math.min(180, 25+155*Math.min(1, el/900));
    if (el < 320){
      const e = ease(el/320); st.ty = lerp(st.ty0, GRID_Y[0], e); st.bedX = lerp(st.bedX0, 35-GRID_X[0], e); st.g = lerp(st.g0, G_TOUCH, e);
    } else if (el < 320 + 36*110){
      const i = Math.floor((el-320)/110);
      const row = Math.floor(i/6), col = i%6;
      const gy = GRID_Y[row], gx = GRID_X[col];
      const e = ease(Math.min(1, ((el-320)%110)/110));
      st.ty = lerp(st.ty, gy, Math.min(1, dt*20));
      st.bedX = lerp(st.bedX, 35-gx, Math.min(1, dt*20));
      st.g = G_TOUCH + .5*Math.sin(e*Math.PI);
      st.probe = Math.min(36, i+1);
    } else if (el < 320 + 36*110 + 1100){
      const vt = el - (320 + 36*110);
      st.g = G_TOUCH + 4;
      st.bedX = Math.sin(vt*.055)*1.1;
      st.ty = 38 + Math.sin(vt*.07)*.9;
      st.probe = 36;
    } else {
      st.level = true; st.phase = 'idle'; st.probe = 36; st.g = G_IDLE; st.ty = 34; st.bedX = 0; st.nozzleT = 25;
      say(st,'level','自动调平完成 · 36 点高度已补偿');
    }
  }

  else if (st.phase === 'printing'){
    st.nozzleT = Math.min(220, 25 + 195*Math.min(1, el/900));
    st.bedT = Math.min(60, 25 + 35*Math.min(1, el/1200));
    if (el < 700){
      const e = ease(el/700);
      st.ty = lerp(st.ty0, 59, e); st.g = lerp(st.g0, 36, e); st.bedX = lerp(st.bedX0, 0, e);
    } else if (el < 1300){
      const e = ease((el-700)/600);
      st.ty = lerp(59, 34, e); st.g = G_TOUCH; st.bedX = 0;
    } else if (el < 6700){
      const p = Math.min(1, (el-1300)/5400);
      st.prog = p;
      st.bedX = -1 + 2.4*Math.sin(el*.014);
      st.ty = 38 + 4.6*Math.sin(el*.011);
      st.g = G_TOUCH + PART_H*p;
      st.part = true;
    } else if (el < 7600){
      const e = ease((el-6700)/900);
      st.prog = 1; st.bedX = lerp(0, 7, e); st.g = lerp(G_TOUCH+PART_H, G_IDLE, e);
      st.ty = lerp(38, 34, e);
    } else {
      st.prog = 1; st.part = true; st.phase = 'done'; st.bedX = 0; st.ty = 34; st.g = G_IDLE;
      st.nozzleT = 25; st.bedT = 25;
      say(st,'done','打印完成 · 等热床冷却后再取模型');
    }
  }

  else if (st.phase === 'removing'){
    if (el < 700){
      const e = ease(el/700); st.bedX = lerp(st.bedX0, 10, e); st.removeT = 0;
    } else if (el < 2000){
      st.bedX = 10;
      st.removeT = Math.min(1, (el-700)/1300);
    } else if (el < 2700){
      const e = ease((el-2000)/700); st.bedX = lerp(10, 0, e); st.removeT = 1;
    } else {
      st.phase = 'idle'; st.deskPart = true; st.part = false; st.prog = 0; st.bedX = 0; st.removeT = 0;
      say(st,'rm','模型已取下 · 轻弯打印板即可脱模');
    }
  }
}

let loopOn = false;
function runLoop(){
  if (loopOn) return; loopOn = true;
  let last = performance.now();
  ui.animate(() => {
    const st = ui.st, t = performance.now(), dt = Math.min(.05, (t-last)/1000); last = t;
    stepSim(st, t, dt);
    const b = busy();
    if (!b) loopOn = false;
    return b;
  });
}

function wait(){ ui.flash('先等这一步完成'); }
function installPlate(){
  const st = ui.st;
  if (busy()) return wait();
  if (st.plate) return ui.flash('打印板已经装好了');
  st.phase = 'fitting'; st.t0 = now(); st.plateSlide = 11; resetSaid(st);
  ui.flash('沿前缘推入打印板，磁铁会吸住');
  runLoop();
}
function loadFilament(){
  const st = ui.st;
  if (busy()) return wait();
  if (!st.plate) return ui.flash('先按「1 装打印板」，免得料条落到热床上');
  if (st.loaded) return ui.flash('耗材已经装好了');
  st.phase = 'loading'; st.t0 = now(); st.ty0 = st.ty; st.g0 = st.g; st.fil = 0; st.purge = 0; resetSaid(st);
  ui.flash('按绕线方向装好料盘 · 把耗材推入直到停住');
  runLoop();
}
function calibrate(){
  const st = ui.st;
  if (busy()) return wait();
  if (!st.plate) return ui.flash('先装打印板：喷嘴要直接触碰热床测高');
  if (st.level) return ui.flash('已经调平过了');
  st.phase = 'leveling'; st.t0 = now(); st.ty0 = st.ty; st.bedX0 = st.bedX; st.g0 = st.g; st.probe = 0; resetSaid(st);
  ui.flash('喷嘴逐点触碰热床，共 36 点');
  runLoop();
}
function startPrint(){
  const st = ui.st;
  if (busy()) return wait();
  if (!st.plate) return ui.flash('先按「1 装打印板」');
  if (!st.loaded) return ui.flash('先按「2 装载耗材」');
  if (!st.level) return ui.flash('先按「3 自动调平」，否则首层会失败');
  if (st.part) return ui.flash('先按「5 取下模型」');
  st.deskPart = false; st.prog = 0; st.part = false; st.phase = 'printing'; st.t0 = now();
  st.ty0 = st.ty; st.bedX0 = st.bedX; st.g0 = st.g; resetSaid(st);
  ui.flash('热床 60℃ · 喷嘴 220℃ · 热床调平/流量校准已启用');
  runLoop();
}
function removePart(){
  const st = ui.st;
  if (busy()) return wait();
  if (!st.part || st.phase !== 'done') return ui.flash('还没有打印好的模型');
  st.phase = 'removing'; st.t0 = now(); st.bedX0 = st.bedX; st.removeT = 0; resetSaid(st);
  ui.flash('待打印板冷却 · 取下模型（粘牢时取下打印板轻弯脱模）');
  runLoop();
}

    if (q.get('loaded') === '1'){ st.loaded = true; st.fil = 1; }
    if (q.get('level') === '1') st.level = true;
    if (q.has('prog')){
      st.prog = Math.max(0, Math.min(1, +q.get('prog')));
      st.part = st.prog > 0;
      st.phase = st.prog >= 1 ? 'done' : 'printing';
      st.g = G_TOUCH + PART_H*st.prog;
      st.ty = 38; st.bedX = 0;
    }
    if (q.has('ty')) st.ty = +q.get('ty');
    if (q.has('g')) st.g = +q.get('g');
    if (q.has('bd')) st.bedX = +q.get('bd');
    if (q.get('nozzleT')) st.nozzleT = +q.get('nozzleT');

      if (g === 'loading'){ st.plate = true; st.phase = 'loading'; st.ty = 60; st.g = 36; st.nozzleT = 250;
        st.fil = +(q.get('fil') || .65); st.spin = 1.2; st.purge = +(q.get('purge') || 0); st.loaded = false; }
      if (g === 'leveling'){ st.plate = true; st.phase = 'leveling'; st.probe = +(q.get('probe') || 18);
        const i = Math.max(0, st.probe - 1); st.bedX = 35 - GRID_X[i % 6]; st.ty = GRID_Y[Math.floor(i / 6)]; st.g = G_TOUCH; }
      if (g === 'removing'){ st.plate = true; st.loaded = true; st.level = true; st.prog = 1; st.part = true;
        st.phase = 'removing'; st.removeT = +(q.get('t') || .6); st.bedX = 10; st.g = G_IDLE; st.ty = 34; }
    }
  }
});
