<style type="text/css">.caption{word-break:break-word}.row.page-header-section.no-gutters.align-content-center{height:auto!important;min-height:90px}blockquote:before{content:""!important}blockquote{border-top:6px solid #1976d2!important;border-left:0!important;padding:1rem!important}blockquote p{padding:0!important;line-height:26px!important}blockquote p li{font-style:normal!important}i{font-style:normal!important}a.v-list-item--link[href='https://wiki.bambulab.com/en/makerworld'] .v-list-item__avatar i::before{content:url('https://wiki.bambulab.com/makerworld/makerworld.svg')!important}a.v-list-item--link[href='https://wiki.bambulab.com/zh/makerworld'] .v-list-item__avatar i::before{content:url('https://wiki.bambulab.com/makerworld/makerworld.svg')!important}a.v-list-item--link[href='https://wiki.bambulab.com/en/cyberbrick'] .v-list-item__avatar i::before{content:url('https://wiki.bambulab.com/cyberbrick/cb_logo.svg')!important;width:24px!important;height:24px}a.v-list-item--link[href='https://wiki.bambulab.com/zh/cyberbrick'] .v-list-item__avatar i::before{content:url('https://wiki.bambulab.com/cyberbrick/cb_logo.svg')!important;width:24px!important;height:24px}.video-responsive{max-width:720px}.video-responsive-inner{position:relative;padding-bottom:56.25%}.video-responsive-inner iframe,.video-responsive-inner video{position:absolute;width:100%;height:100%;left:0;top:0}div.contents img{cursor:pointer}.mermaid>svg{height:auto}.mermaid{visibility:hidden}.mermaid[data-processed=true]{visibility:visible}header.nav-header .layout>div a[href='/login']{display:none}header.nav-header .layout>div:nth-child(3) hr{display:none}</style><!-- ============================================================
     首页语言自动跳转（独立模块，与其它脚本隔离，勿与其它代码合并）
     ------------------------------------------------------------
     背景：访问根路径 / 时，Wiki.js 服务端会 302 到默认语言首页 /en/home。
     本脚本在落到 /en/home 后，按用户意图决定是否再跳到其语言首页。
     属于二次跳转（/ -> /en/home -> /<lang>/home），是纯前端方案的固有代价。

     意图来源（cookie `wiki_lang`，由 body 脚本在用户点击语言菜单时写入，
     含点选 English 时写 en）：
       - cookie 是非 en 语言 -> 跳到该语言首页（用户明确选过它）；
       - cookie 是 en        -> 留在英文首页（用户明确选过英文）；
       - 没有 cookie（新用户，从没选过）-> 按浏览器语言跳一次（不写 cookie，
         待用户主动选语言后才“锁定”）。
     纯由 cookie 驱动，无需 sessionStorage：选了什么就一直是什么，直到再次选择。

     维护：SUPPORTED 需与 body 中 LANGUAGES 的 locale 码保持一致；新增语言两处都要加。
     ============================================================ -->
  <script type="text/javascript">
  (function () {
    var DEFAULT_LOCALE = 'en';
    var HOME = 'home';
    // 与 body 的 LANGUAGES locale 码保持一致（新增语言两处都要改）
    var SUPPORTED = ['en','zh','pt-br','de','es','fr','it','nl','ja','ko','ru','tr','pl','cs','hu','ro','sv','el'];
    var COOKIE = 'wiki_lang';

    function getCookie(name) {
      var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }

    // 仅在「默认语言首页 /en/home」上考虑自动跳转，不影响其它页面。
    var seg = location.pathname.split('/').filter(Boolean); // ['en','home'] 等
    var firstSeg = (seg[0] || '').toLowerCase();
    var isDefaultHome = (firstSeg === DEFAULT_LOCALE && (seg[1] || '') === HOME && seg.length === 2);
    if (!isDefaultHome) return;

    var cookieLang = getCookie(COOKIE);
    if (cookieLang && SUPPORTED.indexOf(cookieLang) >= 0) {
      // 用户有明确选择：非 en 则跳过去，en 则留下。
      if (cookieLang !== DEFAULT_LOCALE) {
        location.replace('/' + cookieLang + '/' + HOME + location.search + location.hash);
      }
      return;
    }

    // 没有有效 cookie（新用户）：按浏览器语言跳一次，但不写 cookie。
    function pickByBrowser() {
      var langs = navigator.languages || [navigator.language || ''];
      for (var i = 0; i < langs.length; i++) {
        var l = (langs[i] || '').toLowerCase();
        if (SUPPORTED.indexOf(l) >= 0) return l;        // 如 pt-br 直接命中
        var base = l.split('-')[0];
        if (SUPPORTED.indexOf(base) >= 0) return base;  // 如 zh-cn -> zh
      }
      return null;
    }
    var target = pickByBrowser();
    if (!target || target === DEFAULT_LOCALE) return;   // 无匹配或就是英文 -> 留下
    location.replace('/' + target + '/' + HOME + location.search + location.hash);
  })();
  </script>

  <script type="text/javascript" defer>

  function GetQueryString(sGet, name) {
      var reg = new RegExp("(^|&)"+ name +"=([^&]*)(&|$)");
      var r = sGet.match(reg);
      if(r != null) {
          return unescape(r[2]);
      } else {
          return null;
      }
  }

  function getUrlQuery(name) {
      let reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
      let r = window.location.search.substr(1).match(reg);
      if (r != null) {
          return decodeURIComponent(r[2]);
      };

      return null;
  }


  function parseUrl(url) {
      if(url.startsWith('//')) {
          url = location.protocol + url;
      }
      return new window.URL(url);
  }

  function removeUrlParam(param, url = window.location.href) {
      let obj = parseUrl(url);
      obj.searchParams.delete(param);
      return obj.href;
  }

  function SetMaskIconColor() {
      document.querySelector('link[rel="mask-icon"]').setAttribute('color', '#00AE42');
  }

  function HandleVideoHtml() {
      // const rxYoutube = /^.*(?:(?:youtu\.be\/|v\/|vi\/|u\/\w\/|embed\/)|(?:(?:watch)?\?v(?:i)?=|\&v(?:i)?=))([^#\&\?]*).*/
      // the old regex will match https://www.copyright.gov/registration
      const rxYoutube = /^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/
      const rxVimeo = /^.*(vimeo\.com\/)((channels\/[A-z]+\/)|(groups\/[A-z]+\/videos\/))?([0-9]+)/

      document.querySelectorAll('.contents oembed, .contents a').forEach(elm => {
          const url = elm.hasAttribute('url') ? elm.getAttribute('url') : elm.getAttribute('href')
          if (url == null)
              return;

          let newElmHtml = null
          let nWen = url.indexOf('?');
          let GetParam = '';
          let BiliMatch = false;
          let BiliVID = '';
          if(nWen >= 0) {
              GetParam = url.substr(nWen + 1);
              //alert(GetParam);
              let sSrc = GetQueryString(GetParam, 'src');
              let sV = GetQueryString(GetParam, 'v');
              if(sSrc != null && sV != null && sSrc == 'bilibili') {
                  BiliMatch = true;
                  BiliVID = sV;
              }
          }
          const ytMatch = url.match(rxYoutube)
          const vmMatch = !ytMatch && url.match(rxVimeo)
          if(BiliMatch) {
              newElmHtml = '<iframe src="https://player.bilibili.com/player.html?p=1&autoplay=0&bvid=' + BiliVID + '" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" width="100%" height="100%"> </iframe>';
          } else if(ytMatch) {
              newElmHtml = `<iframe id="ytplayer" type="text/html" width="640" height="360" src="https://www.youtube.com/embed/${ytMatch[1]}" frameborder="0" allowfullscreen></iframe>`
          } else if(vmMatch) {
              newElmHtml = `<iframe id="vmplayer" type="text/html" width="640" height="360" src="https://player.vimeo.com/video/${vmMatch[5]}" frameborder="0" allowfullscreen></iframe>`
          } else if(url.endsWith('.mp4')) {
              newElmHtml = `<video controls autostart="0" name="media" width="640" height="360"><source src="${url}" type="video/mp4"></video>`
          } else {
              return
          }

          const container = document.createElement('div')
          container.classList.add('video-responsive')

          const inner = document.createElement('div')
          inner.classList.add('video-responsive-inner')

          inner. insertAdjacentHTML('beforeend', newElmHtml)
          container.append(inner)

          elm.replaceWith(container)
      })
  }

  function HandleSearchPage() {
      const search = getUrlQuery('search')
      if(search) {
          const isAPP = window.innerWidth < 960
          console.log("isAPP: " + isAPP)
          const headerInner = document.querySelector("header.nav-header.v-sheet.theme--dark.v-toolbar.v-toolbar--flat.v-app-bar.v-app-bar--clipped.v-app-bar--fixed.black")
          const input = headerInner.__vue__.$parent
          console.log(input)
          if(input) {
              if(isAPP) {
                  input.searchIsShown = true
              }
              input.search = search
              const target = document.querySelector('.v-application--wrap')
              const observe = new MutationObserver(function(mutations, observe) {
                  mutations.forEach((mutation) => {
                      const nodes = Array.from(mutation.addedNodes)
                      if(nodes.length > 0) {
                          nodes.forEach((node) => {
                              if(node.nodeType === 1) {
                                  if(node.classList.contains('search-results')) {
                                      const btn = document.querySelector('.search-results div.text-xs-center .mx-2.v-btn')
                                      if(btn) {
                                          console.log(btn)
                                          btn.onclick = function() {
                                              const url = removeUrlParam('search')
                                              window.location.href = url
                                          }
                                      }
                                  }
                              }
                          })
                      }
                  })
              });
              observe.observe(target, {
                  childList: true
              });
          }
      }
  }

  function HandleViewerJS()
  {
    const imageContent = document.querySelector('div.contents')
    if (imageContent) {
      const gallery = new Viewer(imageContent,{title:false})
      imageContent.querySelectorAll('img').forEach((item, index) => {
        item.addEventListener('click', () => {
          gallery.view(index)
        })
      })
    }
  }

  const LangMap = {
    en: 'en',
    zh: 'zh-CN'
  }

  const i18n = {
    [LangMap.en]: {
      Comments: "Comments"
    },
    [LangMap.zh]: {
      Comments: "评论"
    }
  }

  function InitArtalk() {
    // 获取class为contents的div元素
    const contentsDiv = document.querySelector('div.contents');

    const pathnameSplit = location.pathname.split('/')
    const lang = LangMap[pathnameSplit[1]] || 'en'

    // 检查元素是否存在，避免报错
    if (contentsDiv) {
      // 在目标元素后面插入新的div
      contentsDiv.insertAdjacentHTML('afterend',
  `<div id="discussion" class="comments-container">
    <div class="comments-header">
      <i aria-hidden="true" class="v-icon notranslate mr-2 mdi mdi-comment-text-outline theme--dark"></i>
      <span>${i18n[lang].Comments}</span>
    </div>
    <div class="comments-main">
      <div>
        <div id="artalk-container"></div>
      </div>
    </div>
  </div>`);
    } else {
      console.warn('未找到class为contents的div元素');
    }

    window.artalk = Artalk.init({
      el:        '#artalk-container',
      pageTitle: '',         // 页面标题 (留空自动获取)
      server:    'https://artalk.bambulab.com',
      site:      'bambulab wiki',
      locale:    lang,
    })
  }

  window.boot.register('vue', () => {

      // window.onload = () => {
      //    SetMaskIconColor();
      //       HandleVideoHtml();
      //      HandleSearchPage();
      //}

      window.addEventListener('load', () => {
          SetMaskIconColor();
           HandleVideoHtml();
          HandleSearchPage();
          HandleViewerJS();
          InitArtalk();
      })
  })

  </script>

<script>
  (function() {
    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (opts && opts.body && typeof opts.body === 'string' && opts.body.includes('search')) {
        try {
          var payload = JSON.parse(opts.body);
          var list = Array.isArray(payload) ? payload : [payload];
          var modified = false;
          list.forEach(function(body) {
            if (body.query && body.query.includes('pages') && body.query.includes('search(query:')) {
              // 当前内容语言以 URL 路径首段为准（/zh/xxx -> zh），与站内其它逻辑一致。
              // 不用 document.documentElement.lang：它反映的是界面语言（可能一直是 en），
              // 还可能被 Chrome 网页翻译等改动，导致搜索 locale 恒为 en。
              var seg = location.pathname.split('/').filter(Boolean);
              var locale = (seg[0] || 'en').toLowerCase();
              body.query = body.query
                .replace('($query: String!)', '($query: String!, $locale: String)')
                .replace(/search\(query:\s*\$query\)/, 'search(query: $query, locale: $locale)');
              body.variables = body.variables || {};
              body.variables.locale = locale;
              modified = true;
            }
          });
          if (modified) {
            opts.body = JSON.stringify(Array.isArray(payload) ? list : list[0]);
          }
        } catch(e) {}
      }
      return origFetch.call(this, url, opts);
    };
  })();
  </script>

     *    paths  : (AI languages only) where to SHOW this language:
     *               null     -> show on all pages (translation complete)
     *               []       -> hidden everywhere (translation incomplete)
     *               ['p1']   -> show only under /<locale>/p1/

    var LANGUAGES = [
      { code: 'en',    name: 'english',    ai: false },
      { code: 'zh',    name: '中文',        ai: false },
      { code: 'pt-br', name: 'português',  ai: true, paths: null,
        footer: notice('Este conteúdo foi traduzido por IA e pode conter pequenas imprecisões ou problemas de redação. Caso note algum problema, entre em contato conosco pelo ' + email + ' e faremos a correção o mais rápido possível.') },

        footer: notice('Dieser Inhalt wurde durch KI übersetzt und kann kleinere Ungenauigkeiten oder Formulierungsprobleme enthalten. Sollten Ihnen Auffälligkeiten auffallen, kontaktieren Sie uns bitte unter ' + email + ', damit wir sie schnellstmöglich korrigieren können.') },

      { code: 'fr',    name: 'français',   ai: true, paths: null,

      { code: 'it',    name: 'italiano',   ai: true, paths: null,
        footer: notice('Questo contenuto è stato tradotto dall\'IA e potrebbe contenere piccole imprecisioni o problemi di formulazione. Se notate qualche problema, contattateci all\'indirizzo ' + email + ' e provvederemo a correggerlo il prima possibile.') },
      { code: 'nl',    name: 'nederlands', ai: true, paths: null,
        footer: notice('Deze inhoud is door AI vertaald en kan kleine onnauwkeurigheden of formuleringsproblemen bevatten. Mocht u iets opmerken, neem dan contact met ons op via ' + email + ', zodat we dit zo snel mogelijk kunnen corrigeren.') },
      { code: 'ja',    name: '日本語',      ai: true, paths: null,
        footer: notice('このコンテンツはAIによって翻訳されており、軽微な不正確さや表現上の問題が含まれる可能性があります。お気づきの点がございましたら、' + email + 'までご連絡ください。できるだけ早く修正いたします。') },
      { code: 'ko',    name: '한국어',      ai: true, paths: null,
        footer: notice('이 콘텐츠는 AI에 의해 번역되었으며 사소한 부정확함이나 표현상의 문제가 포함될 수 있습니다. 문제를 발견하시면 ' + email + '로 연락해 주시기 바랍니다. 최대한 빨리 수정하겠습니다.') },
      { code: 'ru',    name: 'русский',    ai: true, paths: null,
        footer: notice('Этот контент был переведён с помощью ИИ и может содержать незначительные неточности или стилистические проблемы. Если вы заметили какие-либо ошибки, пожалуйста, свяжитесь с нами по адресу ' + email + ', и мы исправим их как можно скорее.') },
      { code: 'tr',    name: 'türkçe',     ai: true, paths: null,
        footer: notice('Bu içerik yapay zeka tarafından çevrilmiştir ve küçük yanlışlıklar veya ifade sorunları içerebilir. Herhangi bir sorun fark ederseniz, lütfen ' + email + ' adresinden bizimle iletişime geçin; en kısa sürede düzelteceğiz.') },
      { code: 'pl',    name: 'polski',     ai: true, paths: null,

      { code: 'cs',    name: 'čeština',    ai: true, paths: null,

      { code: 'hu',    name: 'magyar',     ai: true, paths: null,
        footer: notice('Ez a tartalom mesterséges intelligencia segítségével készült fordítás, ezért kisebb pontatlanságokat vagy nyelvi hibákat tartalmazhat. Ha bármilyen problémát észlel, kérjük, lépjen kapcsolatba velünk a következő címen: ' + email + ', és a lehető leghamarabb javítjuk.') },
      { code: 'ro',    name: 'română',     ai: true, paths: null,
        footer: notice('Acest conținut a fost tradus cu ajutorul inteligenței artificiale și poate conține mici inadvertențe sau formulări imperfecte. Dacă observați orice problemă, vă rugăm să ne contactați la adresa ' + email + ', iar noi o vom corecta cât mai curând posibil.') },
      { code: 'sv',    name: 'svenska',     ai: true, paths: null,
        footer: notice('Detta innehåll har översatts med hjälp av AI och kan innehålla mindre felaktigheter eller språkliga brister. Om du upptäcker några problem, kontakta oss på ' + email + ', så rättar vi dem så snart som möjligt.') },
      { code: 'el',    name: 'ελληνικά',    ai: true, paths: null,
        footer: notice('Αυτό το περιεχόμενο μεταφράστηκε με τη βοήθεια τεχνητής νοημοσύνης και ενδέχεται να περιέχει μικρές ανακρίβειες ή γλωσσικές ατέλειες. Εάν εντοπίσετε οποιοδήποτε πρόβλημα, επικοινωνήστε μαζί μας στη διεύθυνση ' + email + ' και θα το διορθώσουμε το συντομότερο δυνατό.') },
      { code: 'th',    name: 'ไทย',          ai: true, paths: null,
        footer: notice('เนื้อหานี้ได้รับการแปลด้วยความช่วยเหลือของ AI และอาจมีข้อผิดพลาดเล็กน้อยหรือข้อบกพร่องทางภาษา หากคุณพบปัญหาใด ๆ โปรดติดต่อเราที่ ' + email + ' และเราจะแก้ไขโดยเร็วที่สุด') },
      { code: 'vi',    name: 'tiếng Việt',   ai: true, paths: null,
        footer: notice('Nội dung này được dịch với sự hỗ trợ của AI và có thể chứa một số điểm chưa chính xác hoặc hạn chế nhỏ về ngôn ngữ. Nếu bạn phát hiện bất kỳ vấn đề nào, vui lòng liên hệ với chúng tôi qua địa chỉ ' + email + ' và chúng tôi sẽ khắc phục sớm nhất có thể.') },
      { code: 'ar',    name: 'العربية',    ai: true, paths: [],
        footer: notice('تمت ترجمة هذا المحتوى باستخدام الذكاء الاصطناعي، وقد يحتوي على بعض الأخطاء البسيطة أو الصياغات غير الدقيقة. إذا لاحظت أي مشكلة، يُرجى التواصل معنا عبر ' + email + ' وسنعمل على تصحيحها في أقرب وقت ممكن.') },
    ];

    /* ==========   Main logic below, no need to modify  ================ */

    /* Derive the lookup structures the logic uses from the single LANGUAGES list. */
    var aiLocales = LANGUAGES.filter(function(l) { return l.ai; }).map(function(l) { return l.code; });
    var localeOrder = LANGUAGES.map(function(l) { return l.code; });
    var aiEnabledPaths = {};
    var footers = {};
    var localeNameMap = {};
    LANGUAGES.forEach(function(l) {
      localeNameMap[l.name] = l.code;
      if (l.ai) {
        aiEnabledPaths[l.code] = (l.paths === undefined) ? [] : l.paths;
        if (l.footer) footers[l.code] = l.footer;
      }
    });
    var locale = (document.documentElement.lang || '').toLowerCase();
    var sortedNames = Object.keys(localeNameMap).sort(function(a, b) {
      return b.length - a.length;
    });
    function detectLocale(text) {
      var t = (text || '').toLowerCase().trim();
      for (var i = 0; i < sortedNames.length; i++) {
        if (t.indexOf(sortedNames[i].toLowerCase()) !== -1) {
          return localeNameMap[sortedNames[i]];
        }
      }
      return '';
    }
    function cleanBrackets(el) {
      if (!el) return;
      var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
      var nodes = [], n;
      while (n = walker.nextNode()) nodes.push(n);
      nodes.forEach(function(n) {
        var c = n.textContent.replace(/\s*[（(][^）)]*[）)]\s*/g, '').trim();
        if (n.textContent !== c) n.textContent = c;
      });
    }
    function isAiEnabledPathFor(targetLocale) {
      var rule = aiEnabledPaths[targetLocale];
      if (rule === null || rule === undefined) return true;
      var seg = window.location.pathname.split('/').filter(Boolean);
      if (seg.length < 2) return false;
      return rule.indexOf(seg[1].toLowerCase()) !== -1;
    }
    // 当前页面语言：优先取 URL 首段（与 head 跳转脚本、搜索 locale 口径一致，
    // 不受 Chrome 网页翻译篡改 documentElement.lang 的影响），回退到 lang 属性。
    function currentLocaleCode() {
      var seg = window.location.pathname.split('/').filter(Boolean);
      var fromPath = (seg[0] || '').toLowerCase();
      if (localeOrder.indexOf(fromPath) !== -1) return fromPath;
      return locale;  // 回退：document.documentElement.lang
    }
    // 在语言选择按钮（含 .mdi-web 地球图标的那个 v-btn）内，图标之后追加当前语言
    // 简称 + 向右箭头，让“这里能切换语言”更直观。SPA 会重渲染按钮，故每次都检查。
    function decorateLocaleButton() {
      var webIcon = document.querySelector('header .mdi-web, .v-toolbar .mdi-web');
      if (!webIcon) return;
      var btn = webIcon.closest('button.v-btn');
      if (!btn || btn.querySelector('.locale-btn-label')) return;
      var code = currentLocaleCode();
      if (!code) return;
      var label = document.createElement('span');
      label.className = 'locale-btn-label notranslate';
      label.setAttribute('translate', 'no');
      // 简称用 locale code 大写（与菜单里蓝色 chip 一致，如 pt-br -> PT-BR）
      label.appendChild(document.createTextNode(code.toUpperCase()));
      var chevron = document.createElement('i');
      chevron.className = 'v-icon notranslate mdi mdi-chevron-right';
      chevron.setAttribute('aria-hidden', 'true');
      label.appendChild(chevron);
      btn.appendChild(label);
      btn.classList.add('has-locale-label');
    }
    // 记住用户主动选择的语言：点击某语言菜单项时写 cookie（含点 English 写 en）。
    // head 中的首页自动跳转逻辑据此 cookie 决定跳向哪个语言。
    function rememberLangChoice(code) {
      if (!code) return;
      document.cookie = 'wiki_lang=' + encodeURIComponent(code) +
        '; path=/; max-age=31536000; samesite=lax';
    }
    var observer = new MutationObserver(function() {
      decorateLocaleButton();
      if (aiLocales.indexOf(locale) !== -1 && isAiEnabledPathFor(locale)) {
        var content = document.querySelector('.contents');
        if (content && footers[locale] && !content.querySelector('.translation-notice')) {
          content.insertAdjacentHTML('beforeend', footers[locale]);
        }
      }
      var items = document.querySelectorAll('.v-menu__content .v-list-item, .locale-selector .v-list-item');
      if (items.length === 0) return;
      items.forEach(function(item) {
        var titleEl = item.querySelector('.v-list-item__title') || item;
        if (!item.querySelector('.locale-ai-badge')) {
          var code = detectLocale(item.textContent);
          if (code) {
            item.setAttribute('data-locale', code);
            if (aiLocales.indexOf(code) !== -1) {
              var badge = document.createElement('span');
              badge.className = 'locale-ai-badge';
              badge.textContent = 'AI';
              titleEl.appendChild(badge);
            }
          }
        }
        // 用户点击语言项时记住其选择（每项只绑一次）
        if (!item.hasAttribute('data-lang-click-bound')) {
          item.setAttribute('data-lang-click-bound', '1');
          item.addEventListener('click', function() {
            rememberLangChoice(this.getAttribute('data-locale'));
          });
        }
        cleanBrackets(titleEl);
        var code = item.getAttribute('data-locale');
        if (code && aiLocales.indexOf(code) !== -1) {
          item.style.display = isAiEnabledPathFor(code) ? '' : 'none';
        }
      });
      var container = items[0].parentElement;
      if (!container.hasAttribute('data-sorted')) {
        var all = container.querySelectorAll('.v-list-item[data-locale]');
        if (all.length > 0) {
          Array.from(all).sort(function(a, b) {
            var ai = localeOrder.indexOf(a.getAttribute('data-locale'));
            var bi = localeOrder.indexOf(b.getAttribute('data-locale'));
            return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
          }).forEach(function(el) { container.appendChild(el); });
          container.setAttribute('data-sorted', 'true');
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  })();
</script>
